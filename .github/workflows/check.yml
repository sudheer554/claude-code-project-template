name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    name: Claude setup checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - name: Validate settings.json against the official schema
        run: uvx check-jsonschema --schemafile https://json.schemastore.org/claude-code-settings.json .claude/settings.json
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact
      - name: Run checks
        run: scripts/check.sh

  python-pack:
    name: python-fastapi pack works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Apply pack, install, lint, test
        run: |
          scripts/apply-pack.sh python-fastapi
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
